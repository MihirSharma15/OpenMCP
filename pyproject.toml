[project]
name = "openmcp-demo"
version = "0.1.0"
description = "Pay-per-call discovery and execution middleware for the OpenMCP demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.20,<2",
  "pydantic-settings>=2.6,<3",
  "pympp[tempo,server,sqlite]==0.11.0",
  "eth-account>=0.13,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "tomlkit>=0.13,<1",
  "cryptography>=44,<51",
  "pyjwt[crypto]>=2.10,<3",
  "psycopg-pool==3.3.1",
]

[project.optional-dependencies]
creator = ["playwright>=1.51,<2"]

[project.scripts]
openmcp = "openmcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openmcp", "openmcp_provider", "openmcp_creator"]

[tool.hatch.build.targets.wheel.force-include]
"openmcp/adapters/postgres/migrations/001_credit_ledger.sql" = "openmcp/adapters/postgres/migrations/001_credit_ledger.sql"
"openmcp/adapters/postgres/migrations/002_accounts.sql" = "openmcp/adapters/postgres/migrations/002_accounts.sql"

"supabase/migrations/20261005191933_account_product.sql" = "openmcp/product/migrations/20261005191933_account_product.sql"
"supabase/migrations/20261005192312_account_indexes.sql" = "openmcp/product/migrations/20261005192312_account_indexes.sql"
"supabase/migrations/20261006000000_dataforseo.sql" = "openmcp/product/migrations/20261006000000_dataforseo.sql"
"supabase/migrations/20261007000000_tavily.sql" = "openmcp/product/migrations/20261007000000_tavily.sql"
"supabase/migrations/20261007010000_firecrawl.sql" = "openmcp/product/migrations/20261007010000_firecrawl.sql"
"supabase/migrations/20261007020000_exa.sql" = "openmcp/product/migrations/20261007020000_exa.sql"
"supabase/migrations/20261007030000_openweather.sql" = "openmcp/product/migrations/20261007030000_openweather.sql"

"supabase/migrations/20261007040000_companies_house.sql" = "openmcp/product/migrations/20261007040000_companies_house.sql"

"supabase/migrations/20261007050000_deepgram.sql" = "openmcp/product/migrations/20261007050000_deepgram.sql"
"supabase/migrations/20261007060000_builtwith.sql" = "openmcp/product/migrations/20261007060000_builtwith.sql"
"supabase/migrations/20261007070000_nansen.sql" = "openmcp/product/migrations/20261007070000_nansen.sql"

"supabase/migrations/20261007080000_api2pdf.sql" = "openmcp/product/migrations/20261007080000_api2pdf.sql"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.vercel]
entrypoint = "openmcp.product.vercel:app"
