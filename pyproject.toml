[project]
name = "openmcp-demo"
version = "0.1.0"
description = "Pay-per-call discovery and execution middleware for the OpenMCP demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.20,<2",
  "pydantic-settings>=2.6,<3",
  "pympp[tempo,server,sqlite]==0.11.0",
  "eth-account>=0.13,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
openmcp = "openmcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openmcp"]

[tool.hatch.build.targets.wheel.force-include]
"openmcp/adapters/postgres/migrations/001_credit_ledger.sql" = "openmcp/adapters/postgres/migrations/001_credit_ledger.sql"
"openmcp/adapters/postgres/migrations/002_accounts.sql" = "openmcp/adapters/postgres/migrations/002_accounts.sql"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
